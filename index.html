<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocketool</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff6b00;
      --text: #e0e0e0;
      --text-dim: #a0a0a0;
      --border: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    html, body {
      background-color: var(--bg);
      color: var(--text);
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 90px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding-top: 6px;
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      user-select: none;
    }

    .brand-logo .p-white { color: #ffffff; }
    .brand-logo .p-orange { color: var(--accent); }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
    }

    .nav-item {
      color: var(--text-dim);
      font-weight: bold;
      font-size: 0.9rem;
      padding: 4px 8px;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .nav-item.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .slider-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding-top: 100px; 
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .slider-container::-webkit-scrollbar { display: none; }

    .slide-section {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100%;
      scroll-snap-align: start;
      padding: 10px 15px 90px 15px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .content-box {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
    }

    h2 { color: var(--accent); margin-bottom: 12px; font-size: 1.1rem; }
    h3 { font-size: 1rem; margin-bottom: 8px; }

    input, select, textarea, button {
      width: 100%; padding: 10px; margin-bottom: 10px;
      background: #2a2a2a; border: 1px solid var(--border);
      color: #fff; border-radius: 5px; font-size: 0.9rem;
    }

    button.btn-main {
      background: var(--accent); color: #fff; font-weight: bold;
      border: none; cursor: pointer;
    }

    .mat-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    .mat-table th, .mat-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
    .mat-table th { background: #252525; color: var(--accent); font-size: 0.8rem; }
    .mat-table input { margin-bottom: 0; }

    .note-card {
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .note-card:hover {
      border-color: var(--accent);
    }

    .link-list { list-style: none; }
    .link-list li { margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; }
    .link-list a {
      color: #4da6ff; text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; margin-right: 5px;
    }

    .project-card {
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .project-card:hover {
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">
      <span class="p-white">pocke</span><span class="p-orange">tool</span>
    </div>
    <div class="nav-bar">
      <div class="nav-item active" id="nav-0" onclick="scrollToSlide(0)">Progetti</div>
      <div class="nav-item" id="nav-1" onclick="scrollToSlide(1)">Notepad</div>
      <div class="nav-item" id="nav-2" onclick="scrollToSlide(2)">Tools</div>
    </div>
  </header>

  <div class="slider-container" id="slider">

    <!-- SEZIONE 1: PROGETTI -->
    <div class="slide-section" id="slide-0">
      <div class="content-box">
        <h2>I Miei Progetti</h2>
        
        <button class="btn-main" id="new-proj-btn" onclick="toggleProjectForm()">+ Nuovo Progetto</button>

        <div id="project-form" class="card" style="display:none;">
          <h3 id="form-title">Nuovo Progetto</h3>
          <input type="hidden" id="p-id" value="">
          <input type="text" id="p-name" placeholder="Nome del progetto">
          
          <select id="p-cat" onchange="checkCustomCategory(this.value)">
            <option value="Falegnameria">Falegnameria</option>
            <option value="Metallo">Metallo</option>
            <option value="Stampa 3D">Stampa 3D</option>
            <option value="Laser">Laser</option>
            <option value="Altro">Altro (Personalizzato)</option>
          </select>
          <input type="text" id="p-custom-cat" placeholder="Specifica categoria..." style="display:none;">

          <textarea id="p-notes" placeholder="Note tecniche o parametri..." rows="3"></textarea>

          <h4>Elenco Materiali e Costi</h4>
          <table class="mat-table">
            <thead>
              <tr>
                <th>Materiale</th>
                <th style="width: 80px;">Costo (€)</th>
                <th style="width: 35px;"></th>
              </tr>
            </thead>
            <tbody id="materials-list"></tbody>
          </table>
          <button type="button" onclick="addMaterialRow()" style="background:#333;">+ Materiale</button>

          <button class="btn-main" onclick="saveProject()">Salva Progetto</button>
          <button type="button" onclick="hideProjectForm()" style="background:#444;">Annulla</button>
        </div>

        <div id="projects-container"></div>
      </div>
    </div>

    <!-- SEZIONE 2: NOTEPAD -->
    <div class="slide-section" id="slide-1">
      <div class="content-box">
        <h2>Notepad</h2>
        
        <button class="btn-main" id="new-note-btn" onclick="toggleNoteForm()">+ Nuova Nota</button>

        <div id="note-form" class="card" style="display:none;">
          <h3 id="note-form-title">Nuova Nota</h3>
          <input type="hidden" id="note-id" value="">
          <input type="text" id="note-title" placeholder="Titolo della nota...">
          <textarea id="note-content" placeholder="Scrivi il contenuto della nota..." rows="6" style="resize:vertical;"></textarea>

          <button class="btn-main" onclick="saveNoteItem()">Salva Nota</button>
          <button type="button" onclick="hideNoteForm()" style="background:#444;">Annulla</button>
        </div>

        <div id="notes-container"></div>
      </div>
    </div>

    <!-- SEZIONE 3: TOOLS -->
    <div class="slide-section" id="slide-2">
      <div class="content-box">
        <h2>Tools & Risorse</h2>

        <div class="card">
          <h3>Aggiungi nuovo link</h3>
          <input type="text" id="custom-link-title" placeholder="Nome Tool (es. Calcolatore Viti)">
          <input type="url" id="custom-link-url" placeholder="https://...">
          
          <select id="custom-link-cat" onchange="checkToolCustomCategory(this.value)">
            <option value="Stampa 3D">Stampa 3D</option>
            <option value="Laser & Falegnameria">Laser & Falegnameria</option>
            <option value="Altro">Altra Categoria...</option>
          </select>
          <input type="text" id="custom-link-custom-cat" placeholder="Nome nuova categoria..." style="display:none;">

          <button class="btn-main" onclick="addCustomLink()">Aggiungi Link</button>
        </div>

        <div id="tools-categories-container"></div>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 📌 LINK PREDEFINITI
    // ==========================================
    const defaultTools = [
      { id: 1, title: "Makerworld", url: "https://makerworld.com/en", cat: "Stampa 3D", default: true },
      { id: 2, title: "Printables", url: "https://www.printables.com", cat: "Stampa 3D", default: true },
      { id: 3, title: "Boxes.py", url: "https://www.boxes.py", cat: "Laser & Falegnameria", default: true },
      { id: 4, title: "MakerCase", url: "https://makercase.com", cat: "Laser & Falegnameria", default: true },
      { id: 5, title: "Gridfinity", url: "https://gridfinity.perplexinglabs.com/", cat: "Stampa 3D", default: true },
      { id: 6, title: "Tooltrace", url: "https://www.tooltrace.ai/", cat: "Stampa 3D", default: true }
    ];

    const slider = document.getElementById('slider');
    let currentSlide = 0;

    slider.addEventListener('scroll', () => {
      const index = Math.round(slider.scrollLeft / window.innerWidth);
      if (index !== currentSlide && index >= 0 && index < 3) {
        currentSlide = index;
        updateNavActiveState();
      }
    });

    function updateNavActiveState() {
      for(let i = 0; i < 3; i++) {
        const item = document.getElementById(`nav-${i}`);
        if(item) {
          item.classList.toggle('active', i === currentSlide);
        }
      }
    }

    function scrollToSlide(index) {
      currentSlide = index;
      slider.scrollTo({ left: window.innerWidth * index, behavior: 'smooth' });
      updateNavActiveState();
    }

    // --- PROGETTI ---
    let projects = [];
    try {
      projects = JSON.parse(localStorage.getItem('maker_projects')) || [];
    } catch(e) {
      projects = [];
    }

    function toggleProjectForm() {
      const form = document.getElementById('project-form');
      if (form.style.display === 'none') {
        document.getElementById('form-title').innerText = "Nuovo Progetto";
        document.getElementById('p-id').value = '';
        document.getElementById('p-name').value = '';
        document.getElementById('p-cat').value = 'Falegnameria';
        document.getElementById('p-custom-cat').value = '';
        document.getElementById('p-custom-cat').style.display = 'none';
        document.getElementById('p-notes').value = '';
        document.getElementById('materials-list').innerHTML = '';
        form.style.display = 'block';
        document.getElementById('new-proj-btn').style.display = 'none';
      } else {
        hideProjectForm();
      }
    }

    function hideProjectForm() {
      document.getElementById('project-form').style.display = 'none';
      document.getElementById('new-proj-btn').style.display = 'block';
    }

    function checkCustomCategory(val) {
      document.getElementById('p-custom-cat').style.display = val === 'Altro' ? 'block' : 'none';
    }

    function addMaterialRow(name = '', cost = '') {
      const tbody = document.getElementById('materials-list');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" class="m-name" value="${name}" placeholder="Es. Tavola Abete"></td>
        <td><input type="number" class="m-cost" value="${cost}" placeholder="0.00"></td>
        <td><button type="button" onclick="this.closest('tr').remove()" style="background:none; border:none; color:#ff4d4d; cursor:pointer;">✕</button></td>
      `;
      tbody.appendChild(tr);
    }

    function saveProject() {
      const id = document.getElementById('p-id').value;
      const name = document.getElementById('p-name').value;
      if(!name) return alert('Inserisci il nome del progetto');

      let cat = document.getElementById('p-cat').value;
      let customCatInput = document.getElementById('p-custom-cat');
      if(cat === 'Altro') {
        cat = customCatInput.value || 'Altro';
      }

      const notes = document.getElementById('p-notes').value;
      const mNames = document.querySelectorAll('.m-name');
      const mCosts = document.querySelectorAll('.m-cost');

      const materials = [];
      mNames.forEach((el, i) => {
        if(el.value) {
          materials.push({ name: el.value, cost: parseFloat(mCosts[i].value) || 0 });
        }
      });

      if (id) {
        projects = projects.map(p => p.id == id ? { id: Number(id), name, cat, notes, materials } : p);
      } else {
        projects.push({ id: Date.now(), name, cat, notes, materials });
      }

      localStorage.setItem('maker_projects', JSON.stringify(projects));
      hideProjectForm();
      renderProjects();
    }

    function editProject(id) {
      const p = projects.find(item => item.id == id);
      if(!p) return;

      document.getElementById('form-title').innerText = "Modifica Progetto";
      document.getElementById('p-id').value = p.id;
      document.getElementById('p-name').value = p.name;
      
      const selectCat = document.getElementById('p-cat');
      const standardCats = ['Falegnameria', 'Metallo', 'Stampa 3D', 'Laser'];
      if(standardCats.includes(p.cat)) {
        selectCat.value = p.cat;
        document.getElementById('p-custom-cat').style.display = 'none';
        document.getElementById('p-custom-cat').value = '';
      } else {
        selectCat.value = 'Altro';
        document.getElementById('p-custom-cat').style.display = 'block';
        document.getElementById('p-custom-cat').value = p.cat;
      }

      document.getElementById('p-notes').value = p.notes || '';
      
      const tbody = document.getElementById('materials-list');
      tbody.innerHTML = '';
      if(p.materials) {
        p.materials.forEach(m => addMaterialRow(m.name, m.cost));
      }

      document.getElementById('project-form').style.display = 'block';
      document.getElementById('new-proj-btn').style.display = 'none';
      document.getElementById('slide-0').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderProjects() {
      const container = document.getElementById('projects-container');
      container.innerHTML = '';
      if(projects.length === 0) {
        container.innerHTML = '<p style="color:var(--text-dim); text-align:center; margin-top:20px;">Nessun progetto salvato.</p>';
        return;
      }

      projects.forEach(p => {
        const totalCost = p.materials ? p.materials.reduce((sum, m) => sum + m.cost, 0) : 0;
        const card = document.createElement('div');
        card.className = 'card project-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
            <h3 style="margin-bottom:0;">${p.name}</h3>
            <span style="background:var(--accent); color:#fff; padding:2px 8px; border-radius:10px; font-size:0.8rem;">${p.cat}</span>
          </div>
          <p style="color:var(--text-dim); font-size:0.85rem; margin-bottom:6px; white-space: pre-wrap;">${p.notes ? p.notes.substring(0, 60) + (p.notes.length > 60 ? '...' : '') : 'Nessuna nota'}</p>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="color:var(--text); font-size:0.9rem;">Costo: € ${totalCost.toFixed(2)}</strong>
            <div>
              <button type="button" onclick="event.stopPropagation(); editProject(${p.id})" style="width:auto; background:#333; padding:4px 8px; font-size:0.8rem; margin-right:4px;">Modifica</button>
              <button type="button" onclick="event.stopPropagation(); deleteProject(${p.id})" style="width:auto; background:none; border:none; color:#ff4d4d; padding:4px; font-size:0.85rem; cursor:pointer;">🗑️</button>
            </div>
          </div>
        `;
        card.onclick = () => editProject(p.id);
        container.appendChild(card);
      });
    }

    function deleteProject(id) {
      if(confirm('Vuoi davvero cancellare questo progetto?')) {
        projects = projects.filter(p => p.id !== id);
        localStorage.setItem('maker_projects', JSON.stringify(projects));
        renderProjects();
        hideProjectForm();
      }
    }

    // --- NOTEPAD (NOTE MULTIPLE) ---
    let notesList = [];
    try {
      notesList = JSON.parse(localStorage.getItem('maker_notes_list')) || [];
    } catch(e) {
      notesList = [];
    }

    function toggleNoteForm() {
      const form = document.getElementById('note-form');
      if (form.style.display === 'none') {
        document.getElementById('note-form-title').innerText = "Nuova Nota";
        document.getElementById('note-id').value = '';
        document.getElementById('note-title').value = '';
        document.getElementById('note-content').value = '';
        form.style.display = 'block';
        document.getElementById('new-note-btn').style.display = 'none';
      } else {
        hideNoteForm();
      }
    }

    function hideNoteForm() {
      document.getElementById('note-form').style.display = 'none';
      document.getElementById('new-note-btn').style.display = 'block';
    }

    function saveNoteItem() {
      const id = document.getElementById('note-id').value;
      const title = document.getElementById('note-title').value;
      const content = document.getElementById('note-content').value;

      if(!title && !content) return alert('Inserisci almeno un titolo o del testo nella nota');

      const finalTitle = title || 'Nota senza titolo';

      if (id) {
        notesList = notesList.map(n => n.id == id ? { id: Number(id), title: finalTitle, content } : n);
      } else {
        notesList.push({ id: Date.now(), title: finalTitle, content });
      }

      localStorage.setItem('maker_notes_list', JSON.stringify(notesList));
      hideNoteForm();
      renderNotes();
    }

    function editNoteItem(id) {
      const n = notesList.find(item => item.id == id);
      if(!n) return;

      document.getElementById('note-form-title').innerText = "Modifica Nota";
      document.getElementById('note-id').value = n.id;
      document.getElementById('note-title').value = n.title;
      document.getElementById('note-content').value = n.content || '';

      document.getElementById('note-form').style.display = 'block';
      document.getElementById('new-note-btn').style.display = 'none';
      document.getElementById('slide-1').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteNoteItem(id) {
      if(confirm('Vuoi davvero cancellare questa nota?')) {
        notesList = notesList.filter(n => n.id !== id);
        localStorage.setItem('maker_notes_list', JSON.stringify(notesList));
        renderNotes();
        hideNoteForm();
      }
    }

    function renderNotes() {
      const container = document.getElementById('notes-container');
      if(!container) return;
      container.innerHTML = '';

      if(notesList.length === 0) {
        container.innerHTML = '<p style="color:var(--text-dim); text-align:center; margin-top:20px;">Nessuna nota salvata.</p>';
        return;
      }

      notesList.forEach(n => {
        const card = document.createElement('div');
        card.className = 'card note-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
            <h3 style="margin-bottom:0; color:var(--accent);">${n.title}</h3>
            <div>
              <button type="button" onclick="event.stopPropagation(); editNoteItem(${n.id})" style="width:auto; background:#333; padding:4px 8px; font-size:0.8rem; margin-right:4px;">Modifica</button>
              <button type="button" onclick="event.stopPropagation(); deleteNoteItem(${n.id})" style="width:auto; background:none; border:none; color:#ff4d4d; padding:4px; font-size:0.85rem; cursor:pointer;">🗑️</button>
            </div>
          </div>
          <p style="color:var(--text-dim); font-size:0.85rem; white-space: pre-wrap; margin-top:5px;">${n.content ? n.content.substring(0, 80) + (n.content.length > 80 ? '...' : '') : 'Nessun contenuto'}</p>
        `;
        card.onclick = () => editNoteItem(n.id);
        container.appendChild(card);
      });
    }

    // --- TOOLS E LINK ---
    let userTools = [];
    try {
      userTools = JSON.parse(localStorage.getItem('maker_user_tools')) || [];
    } catch(e) {
      userTools = [];
    }

    function checkToolCustomCategory(val) {
      document.getElementById('custom-link-custom-cat').style.display = val === 'Altro' ? 'block' : 'none';
    }

    function addCustomLink() {
      const title = document.getElementById('custom-link-title').value;
      const url = document.getElementById('custom-link-url').value;
      let cat = document.getElementById('custom-link-cat').value;
      
      if(cat === 'Altro') {
        cat = document.getElementById('custom-link-custom-cat').value || 'Altro';
      }

      if(!title || !url) return alert('Inserisci sia il nome che l\'URL');

      userTools.push({ id: Date.now(), title, url, cat, default: false });
      localStorage.setItem('maker_user_tools', JSON.stringify(userTools));

      document.getElementById('custom-link-title').value = '';
      document.getElementById('custom-link-url').value = '';
      document.getElementById('custom-link-custom-cat').value = '';
      document.getElementById('custom-link-cat').value = 'Stampa 3D';
      document.getElementById('custom-link-custom-cat').style.display = 'none';

      renderTools();
      updateCategoryDropdown();
    }

    function deleteUserTool(id) {
      if(confirm('Vuoi rimuovere questo link?')) {
        userTools = userTools.filter(t => t.id !== id);
        localStorage.setItem('maker_user_tools', JSON.stringify(userTools));
        renderTools();
        updateCategoryDropdown();
      }
    }

    function updateCategoryDropdown() {
      const select = document.getElementById('custom-link-cat');
      if(!select) return;
      const currentVal = select.value;
      
      const allTools = [...defaultTools, ...userTools];
      const categories = [...new Set(allTools.map(t => t.cat))];

      let html = '';
      categories.forEach(c => {
        html += `<option value="${c}">${c}</option>`;
      });
      html += `<option value="Altro">Altra Categoria...</option>`;
      
      select.innerHTML = html;
      select.value = categories.includes(currentVal) ? currentVal : categories[0];
    }

    function renderTools() {
      const container = document.getElementById('tools-categories-container');
      if(!container) return;
      container.innerHTML = '';

      const allTools = [...defaultTools, ...userTools];
      const categories = [...new Set(allTools.map(t => t.cat))];

      categories.forEach(cat => {
        const catTools = allTools.filter(t => t.cat === cat);
        
        const card = document.createElement('div');
        card.className = 'card';
        
        let listHtml = `<ul class="link-list">`;
        catTools.forEach(t => {
          listHtml += `
            <li>
              <a href="${t.url}" target="_blank">${t.title}</a>
              ${!t.default ? `<button type="button" onclick="deleteUserTool(${t.id})" style="width:auto; background:none; border:none; color:#ff4d4d; padding:2px 6px; font-size:0.85rem; cursor:pointer;">✕</button>` : ''}
            </li>
          `;
        });
        listHtml += `</ul>`;

        card.innerHTML = `<h3>${cat}</h3>${listHtml}`;
        container.appendChild(card);
      });
    }

    // Inizializzazione all'avvio
    renderProjects();
    renderNotes();
    renderTools();
    updateCategoryDropdown();
    updateNavActiveState();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
